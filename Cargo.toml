[package]
name = "noxmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cross-platform, consent-first network inventory and observability engine."
license = "MIT"

[lib]
name = "noxmap"
path = "src/lib.rs"

[[bin]]
name = "noxmap"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"


